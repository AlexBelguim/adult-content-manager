<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Darkroom is offline</title>
<script>try { if (localStorage.getItem('appTheme') === 'instrument') document.documentElement.dataset.tokens = 'instrument'; } catch (e) {}</script>
<link rel="stylesheet" href="/darkroom-tokens.css">
<link rel="icon" href="/favicon.ico">
<style>
/* the service worker shows this page when the server cannot be reached; the tokens come from /darkroom-tokens.css */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: grid; place-items: center; background: var(--bg); color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
main { width: calc(100% - 32px); max-width: 420px; margin: 16px; padding: 24px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); }
h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
p { margin: 0 0 20px; font-size: 14px; color: var(--dim); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
button { font: inherit; font-weight: 600; min-height: 40px; padding: 0 18px; cursor: pointer; background: var(--accent); color: var(--on-accent); border: 1px solid var(--accent); border-radius: var(--radius); }
button:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
a { color: var(--dim); font-weight: 500; }
a:hover { color: var(--text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Darkroom is offline</h1>
  <p>The server cannot be reached. Check Tailscale or the home network.</p>
  <div class="row">
    <button type="button" id="retry">Try again</button>
    <a href="/">Open the library</a>
  </div>
</main>
<script>document.getElementById('retry').onclick = () => location.reload();</script>
</body>
</html>
