<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>ACM — VR Demo</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script>
    /* ---- recenter: re-anchor the whole UI on the user's current gaze ----
       Works anywhere in space. The point the user is looking at (center of FOV)
       becomes the new center of the layout, including pitch (looking up in bed = UI up). */
    AFRAME.registerComponent('recenter', {
      init: function () {
        this.world = document.querySelector('#world');
        this.head  = document.querySelector('#head');
        this._q = new THREE.Quaternion();
        this._e = new THREE.Euler();
        this._p = new THREE.Vector3();
        this._rot = new THREE.Quaternion();
        this._off = new THREE.Vector3();
        // The user's eye sits at (0, 1.6, 0) within the #world layout — its pivot point.
        this._anchor = new THREE.Vector3(0, 1.6, 0);
        window.__recenter = this.recenter.bind(this);   // global hook for controller buttons
      },
      recenter: function () {
        if (!this.world || !this.head) return;
        const head  = this.head.object3D;
        const world = this.world.object3D;
        head.updateMatrixWorld();
        head.getWorldQuaternion(this._q);
        this._e.setFromQuaternion(this._q, 'YXZ');      // yaw=y, pitch=x, roll=z
        // Keep yaw + pitch (so it follows the FOV up/down), drop roll to stay level.
        this._rot.setFromEuler(new THREE.Euler(this._e.x, this._e.y, 0, 'YXZ'));
        head.getWorldPosition(this._p);
        // Orient the layout to the gaze, then place it so the eye-anchor lands on the head:
        //   world.pos = headPos - R * anchor
        world.quaternion.copy(this._rot);
        this._off.copy(this._anchor).applyQuaternion(this._rot);
        world.position.copy(this._p).sub(this._off);
      }
    });

    /* ---- force-laser: guarantee the raycaster line is visible ----
       laser-controls resets showLine to false until a controller connects and only
       then flips it on via a merge that can drop our styling. We re-assert it on every
       connect/model event so the cyan beam reliably shows on the headset. */
    AFRAME.registerComponent('force-laser', {
      init: function () {
        const enable = () => {
          this.el.setAttribute('raycaster', 'showLine', true);
          this.el.setAttribute('raycaster', 'lineColor', '#6cf0c2');
          this.el.setAttribute('raycaster', 'lineOpacity', 0.9);
        };
        this.el.addEventListener('controllerconnected', enable);
        this.el.addEventListener('controllermodelready', enable);
        // also retry shortly after load in case events fired before we attached
        [200, 800, 2000].forEach(t => setTimeout(enable, t));
      }
    });

    /* ---- system-recenter: hook the headset's own recenter gesture ----
       Long-pressing the Quest's Meta/Oculus button resets the WebXR reference space,
       which fires a 'reset' event. We listen for it and re-anchor the UI to the new
       forward. Deferred a couple of frames so the head pose reflects the reset origin
       (window.requestAnimationFrame is paused during an immersive session, so we use
       the scene tick instead). */
    AFRAME.registerComponent('system-recenter', {
      init: function () {
        this.delay = 0;
        this.el.addEventListener('enter-vr', this.attach.bind(this));
      },
      attach: function () {
        const xr = this.el.renderer && this.el.renderer.xr;
        const session = xr && xr.getSession && xr.getSession();
        if (!session) return;
        const onReset = () => { this.delay = 2; };   // apply ~2 frames later
        const add = rs => { if (rs && rs.addEventListener) rs.addEventListener('reset', onReset); };
        // A separately-requested reference space of the same type still receives the
        // system 'reset', so we don't have to depend on three.js internals.
        session.requestReferenceSpace('local-floor').then(add).catch(() =>
          session.requestReferenceSpace('local').then(add).catch(() => {}));
      },
      tick: function () {
        if (this.delay > 0 && --this.delay === 0 && window.__recenter) window.__recenter();
      }
    });
  </script>
  <style>
    #overlay {
      position: fixed; inset: 0; z-index: 10; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 1.2rem; text-align: center; padding: 2rem;
      background: #07090dcc; color: #e8e6df;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    #overlay h1 { font-size: clamp(1.4rem,5vw,2.2rem); font-weight: 700; letter-spacing:-0.02em; margin:0; }
    #overlay p  { max-width: 28rem; opacity:.75; font-size:.9rem; line-height:1.5; margin:0; }
    #enterBtn {
      appearance:none; border:1px solid #6cf0c2; border-radius:999px;
      background:#6cf0c2; color:#04130d; font:inherit; font-weight:600;
      padding:.75rem 2rem; cursor:pointer;
    }
    .hint { font-size:.75rem; opacity:.45; }
  </style>
</head>
<body>
<a-scene
  background="color: #07090d"
  renderer="antialias:true; colorManagement:true"
  vr-mode-ui="enabled:true"
  system-recenter>

  <!-- Deep space background -->
  <a-sky color="#07090d"></a-sky>

  <!-- Lights so non-flat materials don't go black -->
  <a-light type="ambient" color="#1a2a45" intensity="1.5"></a-light>
  <a-light type="directional" color="#6cf0c2" intensity="0.4" position="0 4 -4"></a-light>

  <!-- Camera rig. The headset drives the camera pose in WebXR; the rig is what we
       move/rotate when recentering so content lands in front of the user. -->
  <a-entity id="rig" position="0 0 0" recenter>
    <a-entity id="head" camera look-controls wasd-controls position="0 1.6 0">
      <!-- Mouse cursor so stations are clickable in flat/desktop mode too -->
      <a-entity cursor="rayOrigin: mouse" raycaster="objects: .clickable; far: 30"></a-entity>
    </a-entity>

    <!-- Quest Touch controllers with laser pointers. laser-controls auto-detects the
         controller model. Trigger = click. Recenter is the headset's own gesture
         (long-press the Meta button), handled by the system-recenter component. -->
    <a-entity id="leftHand"  laser-controls="hand: left" force-laser
              raycaster="objects: .clickable; far: 30; showLine: true; lineColor: #6cf0c2; lineOpacity: 0.9"></a-entity>
    <a-entity id="rightHand" laser-controls="hand: right" force-laser
              raycaster="objects: .clickable; far: 30; showLine: true; lineColor: #6cf0c2; lineOpacity: 0.9"></a-entity>
  </a-entity>

  <!-- Everything the user looks at lives in #world. Recentering moves this whole
       container so the front station snaps in front of the user's current facing. -->
  <a-entity id="world">

<div id="overlay">
  <h1>ACM — VR Demo</h1>
  <p>A proof-of-concept VR interface for Adult Content Manager. Look around to explore the five feature stations.</p>
  <button id="enterBtn">Enter VR</button>
  <button id="flatBtn" style="appearance:none;border:1px solid #5a7a96;border-radius:999px;background:transparent;color:#9bb8d4;font:inherit;padding:.55rem 1.6rem;cursor:pointer;">Explore flat (desktop)</button>
  <span class="hint" id="hint">Quest 3 browser · any WebXR headset · or explore flat on desktop</span>
</div>

<script>
  const scene   = document.querySelector('a-scene');
  const overlay = document.getElementById('overlay');
  const enterBtn = document.getElementById('enterBtn');
  const flatBtn  = document.getElementById('flatBtn');
  const hint     = document.getElementById('hint');

  // Detect immersive-vr support up front so we never blank the screen on an
  // unsupported browser (calling enterVR() there leaves a white canvas).
  let vrSupported = false;
  if (navigator.xr && navigator.xr.isSessionSupported) {
    navigator.xr.isSessionSupported('immersive-vr')
      .then(ok => {
        vrSupported = ok;
        if (!ok) {
          enterBtn.textContent = 'No VR headset detected';
          enterBtn.style.opacity = '0.5';
          hint.textContent = 'Open this page in a WebXR headset browser (e.g. Quest 3) to enter VR.';
        }
      })
      .catch(() => {});
  } else {
    enterBtn.textContent = 'WebXR unavailable';
    enterBtn.style.opacity = '0.5';
    hint.textContent = 'This browser has no WebXR. Use a headset browser, or explore flat below.';
  }

  enterBtn.addEventListener('click', async () => {
    if (!vrSupported) { startFlat(); return; }   // fall back instead of going white
    try {
      await scene.enterVR();
    } catch (e) {
      hint.textContent = 'Could not start VR: ' + (e && e.message ? e.message : e);
      startFlat();
    }
  });

  // Flat mode: just hide the overlay; the scene is already rendering behind it.
  function startFlat() { overlay.style.display = 'none'; }
  flatBtn.addEventListener('click', startFlat);

  scene.addEventListener('enter-vr', () => { overlay.style.display = 'none'; });
  scene.addEventListener('exit-vr',  () => { overlay.style.display = 'flex'; });

  // ---- Interactions: wire up once the scene's entities exist ----
  scene.addEventListener('loaded', () => {
    // Each station gives a quick scale "pop" when clicked, so buttons feel responsive.
    document.querySelectorAll('.station').forEach(st => {
      st.addEventListener('click', () => {
        const o = st.object3D;
        o.scale.set(1.04, 1.04, 1.04);
        setTimeout(() => o.scale.set(1, 1, 1), 140);
      });
    });

    // Keyboard shortcut for desktop testing: press R to recenter.
    window.addEventListener('keydown', e => {
      if (e.key === 'r' || e.key === 'R') { if (window.__recenter) window.__recenter(); }
    });
  });
</script>
