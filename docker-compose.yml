# =============================================================================
# Adult Content Manager - Docker Compose for TrueNAS
# =============================================================================
#
# Quick start:
#   docker compose up -d
#
# Volumes you MUST configure:
#   - ./data     → persistent database & config  (or a TrueNAS dataset)
#   - /mnt/media → your media library on TrueNAS (adjust the host path)
#
# HTTPS is REQUIRED for two things: installing the phone UI as a PWA (Chrome only
# registers a service worker on a secure context) and WebXR (the Quest browser
# won't enter immersive VR over plain HTTP).
#
# -----------------------------------------------------------------------------
# DEFAULT: TLS terminated by Tailscale  (ENABLE_HTTPS=0, as configured below)
# -----------------------------------------------------------------------------
# On the NAS, once:
#
#   tailscale set --hostname=darkroom     # optional, sets the URL
#   tailscale serve --bg 4069
#
# That publishes the container at https://darkroom.<tailnet>.ts.net with a real
# Let's Encrypt cert Tailscale provisions and renews. Nothing to install on the
# phone, and nothing is exposed publicly — `serve` is tailnet-only. (`funnel` is
# the public one. Don't.)
#
# Needs MagicDNS and HTTPS Certificates enabled in the Tailscale admin console.
# Tailscale must be connected on the phone even on the same LAN — it's what
# resolves the name — though it then connects directly over the LAN rather than
# relaying, so there's no speed cost.
#
# Rename BEFORE installing the PWA: the hostname is the origin, so changing it
# later orphans the installed app and re-issues the cert.
#
# -----------------------------------------------------------------------------
# ALTERNATIVE: container terminates TLS itself  (needed for the Quest)
# -----------------------------------------------------------------------------
# A headset on the LAN can't reach a ts.net name unless it runs Tailscale too, so
# for VR set ENABLE_HTTPS=1 and TLS_SAN below, then trust the cert on the headset.
#
# The container self-signs into /app/data (persisted, so it survives restarts and
# stays trusted). TLS_SAN must name every address a client dials (the NAS's LAN
# IP, its hostname). Change TLS_SAN later
# and the cert regenerates to cover it, which means re-trusting it.
#
# To trust it: open https://<NAS-IP>:4069, install ./data/tls-cert.pem as a CA
# (Android: Settings → Security → Encryption & credentials → Install a certificate
# → CA certificate). An untrusted origin is not a secure context, so without this
# the PWA won't install.
#
# Note the two routes are different ORIGINS — separate PWA installs, service
# workers and caches. Pick one for the phone and stay on it.
#
# =============================================================================

services:
  app:
    build: .
    image: adult-content-manager:latest
    container_name: adult-content-manager
    restart: unless-stopped
    # The NAS's own network rather than a published port (the same as Hikari). Docker
    # publishes a port through a helper process (its "userland proxy"), and on TrueNAS
    # that one sometimes keeps the port after a rebuild: "failed to bind port
    # 0.0.0.0:4069/tcp: ... address already in use", and the container doesn't start.
    # On the host's network the app listens on 4069 itself: nothing for Docker to set
    # up, and it sees each caller's real address (its LAN-and-Tailscale-only rule needs
    # that). Another port: PORT below.
    network_mode: host
    environment:
      - NODE_ENV=production
      - PORT=4069
      - DB_PATH=/app/data/app.db
      - MEDIA_BASE_PATH=/media
      - CONTENT_BASE_PATH=/app/content
      - DATA_PATH=/app/data
      # 0 = plain HTTP on 4069, TLS handled by `tailscale serve` (the default —
      # see the header). Set to 1 only if you need the container to do TLS
      # itself, e.g. for a Quest on the LAN that isn't on the tailnet.
      - ENABLE_HTTPS=0
      # Only used when ENABLE_HTTPS=1. Every address you'll reach the app on,
      # comma-separated; bare IPv4 becomes an IP SAN, anything else a DNS SAN.
      # Uncomment and set to the NAS's real LAN IP (and hostname, if you use one).
      # - TLS_SAN=192.168.1.10,truenas.local
      # Or point these at a cert you already have and it's used as-is, never
      # regenerated. `tailscale cert` output works here too, but those expire
      # every 90 days and are only re-read on restart — `tailscale serve` renews
      # itself, which is why it's the default.
      # - TLS_CERT=/app/tls/fullchain.pem
      # - TLS_KEY=/app/tls/privkey.pem
    volumes:
      # Persistent data (database, settings, and the generated tls-*.pem).
      # The cert lives here so it survives restarts — a cert that changed on every
      # boot would have to be re-trusted on the phone each time.
      - ../data:/app/data

      # Media library (one level up from the cloned repo)
      - ../media:/media

    healthcheck:
      # the way the app runs: plain HTTP (ENABLE_HTTPS=0, the default) or its own TLS
      test: ["CMD", "node", "-e", "const s=process.env.ENABLE_HTTPS==='1';const r=require(s?'https':'http').get((s?'https':'http')+'://localhost:'+(process.env.PORT||4069)+'/health',{rejectUnauthorized:false},res=>{process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # -------------------------------------------------------------------------
  # Optional: Pairwise ranking service (uncomment to enable)
  # Adds ML-based preference learning — requires ~4 GB extra for PyTorch
  # -------------------------------------------------------------------------
